name: Build and Test

on:
  push:
    branches: [ main, "improvements/**", "feature/**", "fix/**" ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  maven:
    name: Maven — build, test, package
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 21
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Test all modules
        run: mvn clean test

      - name: Build fat JAR and generate diagrams
        run: mvn clean verify -DskipTests

      - name: Upload fat JAR
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: code-karta-cli-maven
          path: code-karta-cli/target/code-karta-cli-*-all.jar
          retention-days: 7

  gradle:
    name: Gradle — build and test
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 21
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Test all modules
        run: ./gradlew test

      - name: Build fat JAR and generate diagrams
        run: ./gradlew :code-karta-cli:generateDiagrams

      - name: Upload fat JAR
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: code-karta-cli-gradle
          path: code-karta-cli/build/libs/code-karta-cli-*-all.jar
          retention-days: 7

  example:
    name: Example project — compile (Maven + Gradle)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: example-shipping-system
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 21
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Compile with Maven
        run: mvn compile

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Compile with Gradle
        run: ./gradlew compileJava
