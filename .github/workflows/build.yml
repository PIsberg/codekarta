name: Build and Test

on:
  push:
    branches: [ main, "improvements/**", "feature/**", "fix/**" ]
  pull_request:
    branches: [ main ]

jobs:
  maven:
    name: Maven — build, test, package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Test all modules
        run: mvn clean test

      - name: Build fat JAR
        run: mvn clean package -DskipTests

      - name: Upload fat JAR
        uses: actions/upload-artifact@v4
        with:
          name: code-karta-cli-maven
          path: code-karta-cli/target/code-karta-cli-*-all.jar
          retention-days: 7

  gradle:
    name: Gradle — build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Test all modules
        run: ./gradlew test

      - name: Build fat JAR
        run: ./gradlew :code-karta-cli:fatJar

      - name: Upload fat JAR
        uses: actions/upload-artifact@v4
        with:
          name: code-karta-cli-gradle
          path: code-karta-cli/build/libs/code-karta-cli-*-all.jar
          retention-days: 7

  example:
    name: Example project — compile (Maven + Gradle)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: example-shipping-system
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Compile with Maven
        run: mvn compile

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Compile with Gradle
        run: ./gradlew compileJava
