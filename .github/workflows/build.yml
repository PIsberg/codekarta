name: Build and Test

on:
  push:
    branches: [ main, "improvements/**", "feature/**", "fix/**", "chore/**", "docs/**" ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  parity:
    name: Maven and Gradle agree on shared versions
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Cheap and fast, so it runs as its own job: a version split makes the maven and gradle
      # jobs below test different dependency sets, and the failure it produces there is confusing.
      - name: Check pom.xml against build.gradle.kts
        run: python3 scripts/check-build-parity.py

  maven:
    name: Maven — verify, package, regenerate
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 21
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      # One lifecycle run, not "clean test" followed by "clean verify -DskipTests". The second
      # clean threw away the first run's output, and no run ever executed the tests and the
      # static-analysis gate together — which is what a contributor types locally.
      - name: Verify (tests, Checkstyle, PMD, SpotBugs, Error Prone, JaCoCo, diagrams)
        # -Dcorpus.required=true: JdkCorpusTest skips itself when src.zip is missing, which is
        # right on a developer JRE and wrong here. A corpus test that silently skips is not a
        # gate, so on CI its absence is a failure.
        run: ./mvnw -B clean verify -Dcorpus.required=true

      # KartaCli.run is documented as idempotent, and downstream repositories commit the diagrams
      # it produces, so byte drift lands in someone else's repository as a diff nobody made.
      # mvn verify has just regenerated every diagram, CLAUDE.md, GEMINI.md and llms.txt: if any
      # of them differs from what is committed, the invariant is broken or the regeneration was
      # not committed. Both are build failures.
      - name: Regeneration is idempotent and committed
        run: |
          if ! git diff --exit-code; then
            echo "::error::Generated output differs from what is committed. Run 'mvn clean verify' and commit the result."
            exit 1
          fi
          untracked="$(git ls-files --others --exclude-standard)"
          if [ -n "$untracked" ]; then
            echo "::error::The build produced untracked files that are not ignored:"
            echo "$untracked"
            exit 1
          fi

      # code-karta-cli-0.3.0.pom on Maven Central declares no compile-scope dependency at all:
      # the shade plugin's dependency-reduced pom replaced the real one and stripped the four
      # modules the unshaded main jar needs. Anyone declaring code-karta-cli as a dependency got
      # three classes and nothing to run them against. createDependencyReducedPom is now false;
      # this step fails if it ever comes back.
      - name: The CLI pom keeps its dependencies
        run: |
          if [ -f code-karta-cli/dependency-reduced-pom.xml ]; then
            echo "::error::maven-shade-plugin regenerated dependency-reduced-pom.xml. It replaces the published pom and strips the compile dependencies. Set createDependencyReducedPom to false."
            exit 1
          fi
          for module in core input layout render; do
            if ! grep -q "<artifactId>code-karta-$module</artifactId>" code-karta-cli/pom.xml; then
              echo "::error::code-karta-cli/pom.xml no longer declares code-karta-$module. The published artifact would not resolve."
              exit 1
            fi
          done

      - name: Upload fat JAR
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: code-karta-cli-maven
          path: code-karta-cli/target/code-karta-cli-*-all.jar
          retention-days: 7

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: jacoco-report
          path: '*/target/site/jacoco/'
          retention-days: 7

  mutation:
    name: Mutation testing (PIT)
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 21
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      # The mutation profile existed for months and no workflow referenced it, so the only thing
      # it measured was whoever remembered to type it. test-compile runs first because a bare
      # plugin goal resolves siblings from the repository rather than building them.
      - name: Run PIT
        run: ./mvnw -B -Pmutation test-compile org.pitest:pitest-maven:mutationCoverage

      - name: Upload mutation report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pit-reports
          path: '*/target/pit-reports/'
          retention-days: 7

  java17:
    name: Library runs on Java 17
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # 21 to build, 17 to run. setup-java writes JAVA_HOME_17_X64 for the first entry and leaves
      # JAVA_HOME pointing at the last, so the build below uses 21 and the consumer uses 17.
      - name: Set up JDK 17 and 21
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          java-version: |
            17
            21
          distribution: 'temurin'
          cache: 'maven'

      - name: Build and install the library
        run: ./mvnw -B -q -DskipTests -Dinvoker.skip=true -Dcheckstyle.skip -Dpmd.skip -Dcpd.skip -Dspotbugs.skip -Djacoco.skip -DskipDiagrams=true install

      # maven.compiler.release=17 only tells javac which API to compile against. It says nothing
      # about whether the result loads on a 17 runtime, which is what a consumer on 17 actually
      # needs. This job compiles a consumer with JDK 17 and runs it on JDK 17, against the jars
      # that were just installed.
      - name: Compile and run a consumer on JDK 17
        run: |
          set -euo pipefail
          VERSION="$(./mvnw -B -q help:evaluate -Dexpression=project.version -DforceStdout)"
          mkdir -p /tmp/consumer17/src
          cat > /tmp/consumer17/pom.xml <<'POM'
          <project xmlns="http://maven.apache.org/POM/4.0.0">
            <modelVersion>4.0.0</modelVersion>
            <groupId>test</groupId><artifactId>consumer17</artifactId><version>1</version>
            <dependencies>
              <dependency><groupId>se.deversity.codekarta</groupId><artifactId>code-karta-input</artifactId><version>VERSION_PLACEHOLDER</version></dependency>
              <dependency><groupId>se.deversity.codekarta</groupId><artifactId>code-karta-layout</artifactId><version>VERSION_PLACEHOLDER</version></dependency>
              <dependency><groupId>se.deversity.codekarta</groupId><artifactId>code-karta-render</artifactId><version>VERSION_PLACEHOLDER</version></dependency>
            </dependencies>
          </project>
          POM
          cat > /tmp/consumer17/src/Consumer.java <<'JAVA'
          import se.deversity.codekarta.core.model.Graph;
          import se.deversity.codekarta.input.JavaSourceInputParser;
          import se.deversity.codekarta.layout.ElkLayoutEngine;
          import se.deversity.codekarta.render.SvgRenderer;
          import java.nio.file.Path;

          public class Consumer {
              public static void main(String[] args) {
                  Graph graph = new JavaSourceInputParser().parse(Path.of(args[0]));
                  // ElkLayoutEngine on purpose: on a 17 runtime ELK's ServiceLoader fails because
                  // org.eclipse.xtext.xbase.lib is compiled for 21, and the documented contract is
                  // that it degrades to SimpleLayoutEngine rather than throwing.
                  new ElkLayoutEngine().layout(graph);
                  String svg = new SvgRenderer().render(graph);
                  if (!System.getProperty("java.specification.version").equals("17")) {
                      throw new IllegalStateException("expected a Java 17 runtime, got "
                          + System.getProperty("java.version"));
                  }
                  if (graph.getNodes().isEmpty() || !svg.contains("<svg")) {
                      throw new IllegalStateException("library produced nothing on Java 17");
                  }
                  System.out.println("ok: java=" + System.getProperty("java.version")
                      + " nodes=" + graph.getNodes().size() + " svgBytes=" + svg.length());
              }
          }
          JAVA
          sed -i "s/VERSION_PLACEHOLDER/$VERSION/g" /tmp/consumer17/pom.xml
          ./mvnw -B -q -f /tmp/consumer17/pom.xml dependency:build-classpath -Dmdep.outputFile=/tmp/consumer17/cp.txt
          CP="$(cat /tmp/consumer17/cp.txt)"
          "$JAVA_HOME_17_X64/bin/javac" -d /tmp/consumer17/classes -cp "$CP" /tmp/consumer17/src/Consumer.java
          "$JAVA_HOME_17_X64/bin/java" -cp "/tmp/consumer17/classes:$CP" Consumer \
            example-shipping-system/src/main/java/com/karta/shipping/domain

      # A library module silently moving back to 21 bytecode would break every Java 17 consumer,
      # and the job above would keep passing until the change reached a release.
      # A run of the shipped CLI jar on 17, which is what a user on 17 actually does. --layout elk
      # on purpose: ELK's transitive xtext dependency is built for 21, and the documented behaviour
      # is a logged fallback to SimpleLayoutEngine rather than a crash.
      - name: Run the fat jar on JDK 17
        run: |
          set -euo pipefail
          ./mvnw -B -q -pl code-karta-cli -am -DskipTests -Dcheckstyle.skip -Dpmd.skip -Dcpd.skip -Dspotbugs.skip -Djacoco.skip -DskipDiagrams=true package
          jar="$(ls code-karta-cli/target/code-karta-cli-*-all.jar)"
          "$JAVA_HOME_17_X64/bin/java" -jar "$jar"             --input example-shipping-system/src/main/java/com/karta/shipping/domain             --output /tmp/cli17out --layout elk
          test -s /tmp/cli17out/class-diagram.svg

      - name: Every jar carries Java 17 bytecode
        run: |
          set -euo pipefail
          for module in core input layout render cli maven-plugin; do
            jar="$(find ~/.m2/repository/se/deversity/codekarta/code-karta-$module -name '*.jar' ! -name '*sources*' ! -name '*javadoc*' | head -1)"
            cls="$(unzip -Z1 "$jar" '*.class' | head -1)"
            major="$(unzip -p "$jar" "$cls" | od -An -tu1 -j6 -N2 | awk '{print $2}')"
            echo "code-karta-$module: $cls major=$major"
            if [ "$major" != "61" ]; then
              echo "::error::code-karta-$module compiles to class file major $major, expected 61 (Java 17). See <library.release> in pom.xml."
              exit 1
            fi
          done

  gradle:
    name: Gradle — build and test
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 21
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      # gradle-wrapper.jar is a committed binary that every build executes, so a tampered one runs
      # before any other check does. gradle-wrapper.properties now pins the distribution by
      # SHA-256; this validates the jar itself against Gradle's published checksums.
      - name: Validate the Gradle wrapper
        uses: gradle/actions/wrapper-validation@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4

      - name: Test all modules
        run: ./gradlew test

      - name: Build fat JAR and generate diagrams
        run: ./gradlew :code-karta-cli:generateDiagrams

      # The Gradle build must produce the same diagram bytes as the Maven build. If it does not,
      # the two builds disagree about the artifact this project exists to produce.
      - name: Regeneration matches the committed output
        run: |
          if ! git diff --exit-code; then
            echo "::error::Gradle-generated output differs from what is committed."
            exit 1
          fi

      - name: Upload fat JAR
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: code-karta-cli-gradle
          path: code-karta-cli/build/libs/code-karta-cli-*-all.jar
          retention-days: 7

  example:
    name: Example project — compile (Maven + Gradle)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: example-shipping-system
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 21
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Compile with Maven
        run: mvn compile

      # The Gradle distribution is downloaded by the wrapper on every run of this job, because
      # setup-java's cache here is 'maven'. That made this the one job structurally exposed to a
      # services.gradle.org outage: it failed 4/4 attempts while the gradle job, which restores a
      # cached distribution, passed on the same run. Cache the distribution itself.
      - name: Cache the Gradle distribution
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.gradle/wrapper/dists
          key: gradle-dist-${{ hashFiles('**/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-dist-

      - name: Compile with Gradle
        run: ./gradlew compileJava
