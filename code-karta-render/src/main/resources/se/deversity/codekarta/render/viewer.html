<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="generator" content="code-karta">
<title>code-karta diagrams</title>
<style>
  :root {
    --bg: #f9fafb; --panel: #ffffff; --text: #1f2937; --muted: #6b7280;
    --border: #e5e7eb; --accent: #1d4ed8; --active: #eff6ff;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  }
  body.dark {
    --bg: #0f172a; --panel: #111827; --text: #e5e7eb; --muted: #9ca3af;
    --border: #374151; --accent: #93c5fd; --active: #1e293b;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { display: grid; grid-template-columns: 280px 1fr; grid-template-rows: auto 1fr;
         background: var(--bg); color: var(--text); }
  header { grid-column: 1 / 3; display: flex; gap: 12px; align-items: center; flex-wrap: wrap;
           padding: 10px 16px; background: var(--panel); border-bottom: 1px solid var(--border); }
  header h1 { font-size: 16px; margin: 0 12px 0 0; }
  input[type=search] { padding: 6px 10px; border: 1px solid var(--border); border-radius: 6px;
                       background: var(--bg); color: var(--text); min-width: 220px; }
  button { padding: 5px 10px; border: 1px solid var(--border); border-radius: 6px;
           background: var(--panel); color: var(--text); cursor: pointer; }
  button:hover { border-color: var(--accent); }
  #toggles { display: flex; gap: 10px; flex-wrap: wrap; font-size: 13px; color: var(--muted); }
  #toggles label { cursor: pointer; white-space: nowrap; }
  nav { overflow: auto; border-right: 1px solid var(--border); background: var(--panel); padding: 8px; }
  nav input { width: 100%; margin-bottom: 8px; }
  nav ul { list-style: none; margin: 0; padding: 0; }
  nav li button { width: 100%; text-align: left; border: none; border-radius: 6px; padding: 7px 9px;
                  font-size: 13px; overflow-wrap: anywhere; }
  nav li button.active { background: var(--active); color: var(--accent); font-weight: 600; }
  main { position: relative; overflow: hidden; cursor: grab; }
  main.panning { cursor: grabbing; }
  #canvas { transform-origin: 0 0; position: absolute; top: 0; left: 0; }
  body.dark #canvas svg { filter: invert(0.9) hue-rotate(180deg); }
  #empty { padding: 40px; color: var(--muted); }
  .count { color: var(--muted); font-size: 12px; margin-left: auto; }
</style>
</head>
<body>
<header>
  <h1>code-karta diagrams</h1>
  <input id="search" type="search" placeholder="Search nodes (press /)" aria-label="Search nodes">
  <div id="toggles" aria-label="Edge types"></div>
  <button id="zoom-in" title="Zoom in">+</button>
  <button id="zoom-out" title="Zoom out">-</button>
  <button id="zoom-reset" title="Fit to window">Fit</button>
  <button id="theme" title="Switch light and dark">Theme</button>
  <span class="count" id="count"></span>
</header>
<nav>
  <input id="filter" type="search" placeholder="Filter diagrams" aria-label="Filter diagrams">
  <ul id="list"></ul>
</nav>
<main id="stage"><div id="canvas"></div></main>
<script>
"use strict";
// Generated by code-karta. Each diagram is carried here as data rather than loaded from a file:
// a page opened over file:// may not read sibling files, and one SVG at a time in the DOM keeps
// the diagrams' identical definition ids from colliding.
const DIAGRAMS = /*@DIAGRAMS@*/[];

const stage = document.getElementById("stage");
const canvas = document.getElementById("canvas");
const list = document.getElementById("list");
const search = document.getElementById("search");
const filter = document.getElementById("filter");
const toggles = document.getElementById("toggles");
const count = document.getElementById("count");
let current = -1;
let view = { scale: 1, x: 0, y: 0 };

function apply() {
  canvas.style.transform = "translate(" + view.x + "px," + view.y + "px) scale(" + view.scale + ")";
}

function fit() {
  const svg = canvas.querySelector("svg");
  if (!svg) return;
  const w = parseFloat(svg.getAttribute("width")) || svg.getBoundingClientRect().width;
  const h = parseFloat(svg.getAttribute("height")) || svg.getBoundingClientRect().height;
  const s = Math.min(stage.clientWidth / w, stage.clientHeight / h, 1);
  view = { scale: s, x: (stage.clientWidth - w * s) / 2, y: 16 };
  apply();
}

function zoom(factor, cx, cy) {
  const x = cx === undefined ? stage.clientWidth / 2 : cx;
  const y = cy === undefined ? stage.clientHeight / 2 : cy;
  const next = Math.min(8, Math.max(0.05, view.scale * factor));
  view.x = x - (x - view.x) * (next / view.scale);
  view.y = y - (y - view.y) * (next / view.scale);
  view.scale = next;
  apply();
}

function buildList() {
  list.textContent = "";
  const term = filter.value.trim().toLowerCase();
  DIAGRAMS.forEach((d, i) => {
    if (term && !d.title.toLowerCase().includes(term)) return;
    const li = document.createElement("li");
    const b = document.createElement("button");
    b.textContent = d.title;
    b.className = i === current ? "active" : "";
    b.addEventListener("click", () => show(i));
    li.appendChild(b);
    list.appendChild(li);
  });
  count.textContent = DIAGRAMS.length + (DIAGRAMS.length === 1 ? " diagram" : " diagrams");
}

function buildToggles() {
  toggles.textContent = "";
  const types = new Set();
  canvas.querySelectorAll(".edge-line[data-type]").forEach(e => types.add(e.getAttribute("data-type")));
  Array.from(types).sort().forEach(type => {
    const label = document.createElement("label");
    const box = document.createElement("input");
    box.type = "checkbox";
    box.checked = true;
    box.addEventListener("change", () => {
      canvas.querySelectorAll('[data-type="' + type + '"]').forEach(el => {
        el.style.display = box.checked ? "" : "none";
      });
    });
    label.appendChild(box);
    label.appendChild(document.createTextNode(" " + type.toLowerCase().replace(/_/g, " ")));
    toggles.appendChild(label);
  });
}

function highlight() {
  const term = search.value.trim().toLowerCase();
  const nodes = Array.from(canvas.querySelectorAll("g[id]")).filter(g => g.querySelector(".node-rect"));
  const edges = canvas.querySelectorAll(".edge-line, .edge-label");
  if (!term) {
    nodes.forEach(n => { n.style.opacity = ""; });
    edges.forEach(e => { e.style.opacity = ""; });
    return;
  }
  const hits = new Set();
  nodes.forEach(n => {
    const match = n.id.toLowerCase().includes(term) || n.textContent.toLowerCase().includes(term);
    n.style.opacity = match ? "1" : "0.15";
    if (match) hits.add(n.id);
  });
  const touches = id => id && Array.from(hits).some(h => id === h || id.startsWith(h + "."));
  edges.forEach(e => {
    const on = touches(e.getAttribute("data-source")) || touches(e.getAttribute("data-target"));
    e.style.opacity = on ? "1" : "0.08";
  });
}

// A diagram is parsed as SVG and stripped of anything that could run before it is shown. The
// diagrams code-karta renders contain nothing of the kind (their own hover script is not needed
// here), but the viewer lists every .svg in the output directory, whoever wrote it.
function safeSvg(markup) {
  const doc = new DOMParser().parseFromString(markup, "image/svg+xml");
  const root = doc.documentElement;
  if (!root || root.nodeName.toLowerCase() !== "svg") {
    const p = document.createElement("p");
    p.id = "empty";
    p.textContent = "This file is not an SVG the viewer can show.";
    return p;
  }
  root.querySelectorAll("script, foreignObject").forEach(el => el.remove());
  [root, ...root.querySelectorAll("*")].forEach(el => {
    Array.from(el.attributes).forEach(a => {
      const name = a.name.toLowerCase();
      const value = a.value.replace(/[\s\x00-\x1f]/g, "").toLowerCase();
      if (name.startsWith("on") || ((name === "href" || name.endsWith(":href")) && value.startsWith("javascript:"))) {
        el.removeAttribute(a.name);
      }
    });
  });
  return document.importNode(root, true);
}

function show(i) {
  if (i < 0 || i >= DIAGRAMS.length) return;
  current = i;
  canvas.replaceChildren(safeSvg(DIAGRAMS[i].svg));
  document.title = DIAGRAMS[i].title + " - code-karta";
  if (location.hash !== "#" + encodeURIComponent(DIAGRAMS[i].title)) {
    history.replaceState(null, "", "#" + encodeURIComponent(DIAGRAMS[i].title));
  }
  buildList();
  buildToggles();
  highlight();
  fit();
}

function fromHash() {
  const wanted = decodeURIComponent(location.hash.slice(1));
  const i = DIAGRAMS.findIndex(d => d.title === wanted);
  return i >= 0 ? i : 0;
}

let drag = null;
stage.addEventListener("mousedown", e => {
  drag = { x: e.clientX - view.x, y: e.clientY - view.y };
  stage.classList.add("panning");
});
window.addEventListener("mousemove", e => {
  if (!drag) return;
  view.x = e.clientX - drag.x;
  view.y = e.clientY - drag.y;
  apply();
});
window.addEventListener("mouseup", () => { drag = null; stage.classList.remove("panning"); });
stage.addEventListener("wheel", e => {
  e.preventDefault();
  const r = stage.getBoundingClientRect();
  zoom(e.deltaY < 0 ? 1.15 : 1 / 1.15, e.clientX - r.left, e.clientY - r.top);
}, { passive: false });
document.getElementById("zoom-in").addEventListener("click", () => zoom(1.25));
document.getElementById("zoom-out").addEventListener("click", () => zoom(0.8));
document.getElementById("zoom-reset").addEventListener("click", fit);
document.getElementById("theme").addEventListener("click", () => {
  document.body.classList.toggle("dark");
  try { localStorage.setItem("karta-theme", document.body.classList.contains("dark") ? "dark" : "light"); } catch (e) { /* storage off */ }
});
search.addEventListener("input", highlight);
filter.addEventListener("input", buildList);
window.addEventListener("keydown", e => {
  if (e.key === "/" && document.activeElement !== search && document.activeElement !== filter) {
    e.preventDefault();
    search.focus();
  }
});
window.addEventListener("hashchange", () => show(fromHash()));
window.addEventListener("resize", fit);
try { if (localStorage.getItem("karta-theme") === "dark") document.body.classList.add("dark"); } catch (e) { /* storage off */ }

if (DIAGRAMS.length === 0) {
  const p = document.createElement("p");
  p.id = "empty";
  p.textContent = "No diagrams were found when this viewer was generated.";
  canvas.replaceChildren(p);
  buildList();
} else {
  show(fromHash());
}
</script>
</body>
</html>
