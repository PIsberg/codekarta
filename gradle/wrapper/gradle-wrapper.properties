distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
distributionUrl=https\://services.gradle.org/distributions/gradle-9.9.1-bin.zip
# Pins the distribution the wrapper will run, so a build does not execute whatever bytes come
# back from services.gradle.org. Published by Gradle at <distributionUrl>.sha256. Recompute
# when distributionUrl changes; a stale sum fails the build rather than falling back to trust.
distributionSha256Sum=d8a18a7a841dd5df825d35a685fad6f2d7f12ac0c280e57b67c27b4a520ba228
networkTimeout=10000
retries=3
retryBackOffMs=2000
validateDistributionUrl=true
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
