distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
distributionUrl=https\://services.gradle.org/distributions/gradle-9.8.0-bin.zip
# Pins the distribution the wrapper will run, so a build does not execute whatever bytes come
# back from services.gradle.org. Published by Gradle at <distributionUrl>.sha256. Recompute
# when distributionUrl changes; a stale sum fails the build rather than falling back to trust.
distributionSha256Sum=bafd5ce9cfaea0fbccfdc8439a1ac42fbd4cd9c89dc9a988228d8a2639a58e6c
networkTimeout=10000
retries=3
retryBackOffMs=2000
validateDistributionUrl=true
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
