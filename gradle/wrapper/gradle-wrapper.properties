distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
distributionUrl=https\://services.gradle.org/distributions/gradle-9.7.1-bin.zip
# Pins the distribution the wrapper will run, so a build does not execute whatever bytes come
# back from services.gradle.org. Published by Gradle at <distributionUrl>.sha256. Recompute
# when distributionUrl changes; a stale sum fails the build rather than falling back to trust.
distributionSha256Sum=acd53f1edaf02f1a8ff99879f8a34b302661a057d9b063ae9e35b552f804d20a
networkTimeout=10000
retries=3
retryBackOffMs=2000
validateDistributionUrl=true
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
