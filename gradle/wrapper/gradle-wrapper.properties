distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
distributionUrl=https\://services.gradle.org/distributions/gradle-9.9.0-bin.zip
# Pins the distribution the wrapper will run, so a build does not execute whatever bytes come
# back from services.gradle.org. Published by Gradle at <distributionUrl>.sha256. Recompute
# when distributionUrl changes; a stale sum fails the build rather than falling back to trust.
distributionSha256Sum=0b00b0ffe07c4d4789c12d4935a44a7057d55774b7540bd4a3f76f336deb177a
networkTimeout=10000
retries=3
retryBackOffMs=2000
validateDistributionUrl=true
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
