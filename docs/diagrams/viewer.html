 Array.from(svg.querySelectorAll('g')).filter(g =\u003e g.querySelector('.node-rect'));\n  const edges = Array.from(svg.querySelectorAll('.edge-line, .edge-label'));\n  nodes.forEach(node =\u003e {\n    node.style.cursor = 'pointer';\n    node.addEventListener('mouseenter', () =\u003e {\n      const nodeId = node.id;\n      nodes.forEach(n =\u003e {\n        if (n.id !== nodeId) {\n          n.style.opacity = '0.15';\n          n.style.transition = 'opacity 0.2s ease';\n        }\n      });\n      const connectedNodeIds = new Set([nodeId]);\n      edges.forEach(edge =\u003e {\n        const source = edge.getAttribute('data-source');\n        const target = edge.getAttribute('data-target');\n        const isConnected = (source === nodeId || target === nodeId ||\n                             (source \u0026\u0026 source.startsWith(nodeId + '.')) ||\n                             (target \u0026\u0026 target.startsWith(nodeId + '.')) ||\n                             (nodeId \u0026\u0026 nodeId.startsWith(source + '.')) ||\n                             (nodeId \u0026\u0026 nodeId.startsWith(target + '.')));\n        if (isConnected) {\n          if (source) connectedNodeIds.add(source);\n          if (target) connectedNodeIds.add(target);\n          const dotSrc = source ? source.lastIndexOf('.') : -1;\n          if (dotSrc \u003e 0) connectedNodeIds.add(source.substring(0, dotSrc));\n          const dotTgt = target ? target.lastIndexOf('.') : -1;\n          if (dotTgt \u003e 0) connectedNodeIds.add(target.substring(0, dotTgt));\n          edge.style.opacity = '1';\n          if (edge.classList.contains('edge-line')) {\n            edge.style.strokeWidth = '2.8px';\n          }\n          edge.style.fontWeight = 'bold';\n          edge.style.transition = 'opacity 0.2s ease, stroke-width 0.2s ease';\n        } else {\n          edge.style.opacity = '0.08';\n          edge.style.transition = 'opacity 0.2s ease';\n        }\n      });\n      nodes.forEach(n =\u003e {\n        if (connectedNodeIds.has(n.id)) {\n          n.style.opacity = '1';\n        }\n      });\n    });\n    node.addEventListener('mouseleave', () =\u003e {\n      nodes.forEach(n =\u003e {\n        n.style.opacity = '1';\n      });\n      edges.forEach(edge =\u003e {\n        edge.style.opacity = '1';\n        edge.style.strokeWidth = '';\n        edge.style.fontWeight = '';\n      });\n    });\n  });\n});\n]]\u003e\n\u003c/script\u003e\n\u003c/svg\u003e\n"},

'.') : -1;\n          if (dotTgt \u003e 0) connectedNodeIds.add(target.substring(0, dotTgt));\n          edge.style.opacity = '1';\n          if (edge.classList.contains('edge-line')) {\n            edge.style.strokeWidth = '2.8px';\n          }\n          edge.style.fontWeight = 'bold';\n          edge.style.transition = 'opacity 0.2s ease, stroke-width 0.2s ease';\n        } else {\n          edge.style.opacity = '0.08';\n          edge.style.transition = 'opacity 0.2s ease';\n        }\n      });\n      nodes.forEach(n =\u003e {\n        if (connectedNodeIds.has(n.id)) {\n          n.style.opacity = '1';\n        }\n      });\n    });\n    node.addEventListener('mouseleave', () =\u003e {\n      nodes.forEach(n =\u003e {\n        n.style.opacity = '1';\n      });\n      edges.forEach(edge =\u003e {\n        edge.style.opacity = '1';\n        edge.style.strokeWidth = '';\n        edge.style.fontWeight = '';\n      });\n    });\n  });\n});\n]]\u003e\n\u003c/script\u003e\n\u003ca class=\"diagram-attribution\" href=\"https://github.com/PIsberg/codekarta\" target=\"_blank\" rel=\"noopener noreferrer\"\u003e\n  \u003ctext x=\"1064.0\" y=\"864.0\" text-anchor=\"end\" font-family=\"sans-serif\" font-size=\"11\" fill=\"#6b7280\" text-decoration=\"underline\"\u003eCreated with https://github.com/PIsberg/codekarta\u003c/text\u003e\n\u003c/a\u003e\n\u003c/svg\u003e\n"},

ctedNodeIds.add(source.substring(0, dotSrc));\n          const dotTgt = target ? target.lastIndexOf('.') : -1;\n          if (dotTgt \u003e 0) connectedNodeIds.add(target.substring(0, dotTgt));\n          edge.style.opacity = '1';\n          if (edge.classList.contains('edge-line')) {\n            edge.style.strokeWidth = '2.8px';\n          }\n          edge.style.fontWeight = 'bold';\n          edge.style.transition = 'opacity 0.2s ease, stroke-width 0.2s ease';\n        } else {\n          edge.style.opacity = '0.08';\n          edge.style.transition = 'opacity 0.2s ease';\n        }\n      });\n      nodes.forEach(n =\u003e {\n        if (connectedNodeIds.has(n.id)) {\n          n.style.opacity = '1';\n        }\n      });\n    });\n    node.addEventListener('mouseleave', () =\u003e {\n      nodes.forEach(n =\u003e {\n        n.style.opacity = '1';\n      });\n      edges.forEach(edge =\u003e {\n        edge.style.opacity = '1';\n        edge.style.strokeWidth = '';\n        edge.style.fontWeight = '';\n      });\n    });\n  });\n});\n]]\u003e\n\u003c/script\u003e\n\u003c/svg\u003e\n"},

const stage = document.getElementById("stage");
const canvas = document.getElementById("canvas");
const list = document.getElementById("list");
const search = document.getElementById("search");
const filter = document.getElementById("filter");
const toggles = document.getElementById("toggles");
const count = document.getElementById("count");
let current = -1;
let view = { scale: 1, x: 0, y: 0 };

function apply() {
  canvas.style.transform = "translate(" + view.x + "px," + view.y + "px) scale(" + view.scale + ")";
}

function fit() {
  const svg = canvas.querySelector("svg");
  if (!svg) return;
  const w = parseFloat(svg.getAttribute("width")) || svg.getBoundingClientRect().width;
  const h = parseFloat(svg.getAttribute("height")) || svg.getBoundingClientRect().height;
  const s = Math.min(stage.clientWidth / w, stage.clientHeight / h, 1);
  view = { scale: s, x: (stage.clientWidth - w * s) / 2, y: 16 };
  apply();
}

function zoom(factor, cx, cy) {
  const x = cx === undefined ? stage.clientWidth / 2 : cx;
  const y = cy === undefined ? stage.clientHeight / 2 : cy;
  const next = Math.min(8, Math.max(0.05, view.scale * factor));
  view.x = x - (x - view.x) * (next / view.scale);
  view.y = y - (y - view.y) * (next / view.scale);
  view.scale = next;
  apply();
}

function buildList() {
  list.textContent = "";
  const term = filter.value.trim().toLowerCase();
  DIAGRAMS.forEach((d, i) => {
    if (term && !d.title.toLowerCase().includes(term)) return;
    const li = document.createElement("li");
    const b = document.createElement("button");
    b.textContent = d.title;
    b.className = i === current ? "active" : "";
    b.addEventListener("click", () => show(i));
    li.appendChild(b);
    list.appendChild(li);
  });
  count.textContent = DIAGRAMS.length + (DIAGRAMS.length === 1 ? " diagram" : " diagrams");
}

function buildToggles() {
  toggles.textContent = "";
  const types = new Set();
  canvas.querySelectorAll(".edge-line[data-type]").forEach(e => types.add(e.getAttribute("data-type")));
  Array.from(types).sort().forEach(type => {
    const label = document.createElement("label");
    const box = document.createElement("input");
    box.type = "checkbox";
    box.checked = true;
    box.addEventListener("change", () => {
      canvas.querySelectorAll('[data-type="' + type + '"]').forEach(el => {
        el.style.display = box.checked ? "" : "none";
      });
    });
    label.appendChild(box);
    label.appendChild(document.createTextNode(" " + type.toLowerCase().replace(/_/g, " ")));
    toggles.appendChild(label);
  });
}

function highlight() {
  const term = search.value.trim().toLowerCase();
  const nodes = Array.from(canvas.querySelectorAll("g[id]")).filter(g => g.querySelector(".node-rect"));
  const edges = canvas.querySelectorAll(".edge-line, .edge-label");
  if (!term) {
    nodes.forEach(n => { n.style.opacity = ""; });
    edges.forEach(e => { e.style.opacity = ""; });
    return;
  }
  const hits = new Set();
  nodes.forEach(n => {
    const match = n.id.toLowerCase().includes(term) || n.textContent.toLowerCase().includes(term);
    n.style.opacity = match ? "1" : "0.15";
    if (match) hits.add(n.id);
  });
  const touches = id => id && Array.from(hits).some(h => id === h || id.startsWith(h + "."));
  edges.forEach(e => {
    const on = touches(e.getAttribute("data-source")) || touches(e.getAttribute("data-target"));
    e.style.opacity = on ? "1" : "0.08";
  });
}

// A diagram is parsed as SVG and rebuilt from an allowlist before it is shown: only SVG drawing
// elements survive (no script, foreignObject, animation, image or foreign-namespace element), no
// event-handler attribute, and a URL only as a same-document #reference or an http(s) link on <a>.
// The diagrams code-karta renders need nothing else, but the viewer lists every .svg in the output
// directory, whoever wrote it. The page's Content-Security-Policy is the second layer: it lets only
// this script run, so a handler or javascript: URL that got past this function still would not.
const SVG_NS = "http://www.w3.org/2000/svg";
const ALLOWED = new Set(["svg", "g", "defs", "style", "title", "desc", "rect", "circle", "ellipse",
  "line", "polyline", "polygon", "path", "text", "tspan", "textPath", "a", "use", "symbol", "marker",
  "linearGradient", "radialGradient", "stop", "pattern", "clipPath", "mask", "filter",
  "feDropShadow", "feGaussianBlur", "feOffset", "feFlood", "feComposite", "feMerge", "feMergeNode",
  "feBlend", "feColorMatrix"]);
const URL_ATTRS = new Set(["href", "xlink:href", "src", "action", "formaction", "data", "to", "from",
  "values", "by"]);

function clean(el) {
  Array.from(el.children).forEach(child => {
    if (child.namespaceURI !== SVG_NS || !ALLOWED.has(child.localName)) {
      child.remove();
    } else {
      clean(child);
    }
  });
  Array.from(el.attributes).forEach(a => {
    const name = a.name.toLowerCase();
    const value = a.value.replace(/[\s\x00-\x1f]/g, "").toLowerCase();
    const urlOk = value.startsWith("#")
      || (el.localName === "a" && (value.startsWith("https:") || value.startsWith("http:")));
    if (name.startsWith("on") || (URL_ATTRS.has(name) && !urlOk) || value.includes("javascript:")) {
      el.removeAttribute(a.name);
    }
  });
}

function safeSvg(markup) {
  const doc = new DOMParser().parseFromString(markup, "image/svg+xml");
  const root = doc.documentElement;
  if (!root || root.namespaceURI !== SVG_NS || root.localName !== "svg") {
    const p = document.createElement("p");
    p.id = "empty";
    p.textContent = "This file is not an SVG the viewer can show.";
    return p;
  }
  clean(root);
  return document.importNode(root, true);
}

function show(i) {
  if (i < 0 || i >= DIAGRAMS.length) return;
  current = i;
  canvas.replaceChildren(safeSvg(DIAGRAMS[i].svg));
  document.title = DIAGRAMS[i].title + " - code-karta";
  if (location.hash !== "#" + encodeURIComponent(DIAGRAMS[i].title)) {
    history.replaceState(null, "", "#" + encodeURIComponent(DIAGRAMS[i].title));
  }
  buildList();
  buildToggles();
  highlight();
  fit();
}

function fromHash() {
  const wanted = decodeURIComponent(location.hash.slice(1));
  const i = DIAGRAMS.findIndex(d => d.title === wanted);
  return i >= 0 ? i : 0;
}

let drag = null;
stage.addEventListener("mousedown", e => {
  drag = { x: e.clientX - view.x, y: e.clientY - view.y };
  stage.classList.add("panning");
});
window.addEventListener("mousemove", e => {
  if (!drag) return;
  view.x = e.clientX - drag.x;
  view.y = e.clientY - drag.y;
  apply();
});
window.addEventListener("mouseup", () => { drag = null; stage.classList.remove("panning"); });
stage.addEventListener("wheel", e => {
  e.preventDefault();
  const r = stage.getBoundingClientRect();
  zoom(e.deltaY < 0 ? 1.15 : 1 / 1.15, e.clientX - r.left, e.clientY - r.top);
}, { passive: false });
document.getElementById("zoom-in").addEventListener("click", () => zoom(1.25));
document.getElementById("zoom-out").addEventListener("click", () => zoom(0.8));
document.getElementById("zoom-reset").addEventListener("click", fit);
document.getElementById("theme").addEventListener("click", () => {
  document.body.classList.toggle("dark");
  try { localStorage.setItem("karta-theme", document.body.classList.contains("dark") ? "dark" : "light"); } catch (e) { /* storage off */ }
});
search.addEventListener("input", highlight);
filter.addEventListener("input", buildList);
window.addEventListener("keydown", e => {
  if (e.key === "/" && document.activeElement !== search && document.activeElement !== filter) {
    e.preventDefault();
    search.focus();
  }
});
window.addEventListener("hashchange", () => show(fromHash()));
window.addEventListener("resize", fit);
try { if (localStorage.getItem("karta-theme") === "dark") document.body.classList.add("dark"); } catch (e) { /* storage off */ }

if (DIAGRAMS.length === 0) {
  const p = document.createElement("p");
  p.id = "empty";
  p.textContent = "No diagrams were found when this viewer was generated.";
  canvas.replaceChildren(p);
  buildList();
} else {
  show(fromHash());
}
</script>
</body>
</html>
