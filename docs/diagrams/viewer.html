<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>codekarta diagram viewer</title>
<style>
  body { margin: 0; background: #111; font-family: sans-serif; color: #eee; }
  h2 { text-align: center; margin: 12px 0 4px; font-size: 13px; color: #aaa; letter-spacing: 1px; text-transform: uppercase; }
  .row { display: flex; gap: 12px; padding: 8px 12px; }
  .cell { flex: 1; background: #1a1a1a; border-radius: 8px; padding: 8px; min-width: 0; }
  .cell h3 { margin: 0 0 6px; font-size: 11px; color: #888; text-transform: uppercase; letter-spacing: 1px; }
  .cell img { width: 100%; height: auto; border-radius: 4px; display: block; }
</style>
</head>
<body>
<h2>codekarta — generated diagrams</h2>
<div class="row">
  <div class="cell"><h3>Module diagram</h3><img src="module-diagram.svg"></div>
  <div class="cell"><h3>Class diagram</h3><img src="class-diagram.svg"></div>
</div>
<div class="row">
  <div class="cell"><h3>Exception-flow sequence (KartaCli)</h3><img src="kartacli-sequence-diagram.svg"></div>
  <div class="cell"><h3>Call-only sequence (CallSequenceParser)</h3><img src="callsequenceparser-sequence-diagram.svg"></div>
</div>
<div class="row">
  <div class="cell"><h3>Multi-file stitched sequence</h3><img src="sequence-diagram.svg"></div>
  <div class="cell"><h3>State machine (KartaCli pipeline)</h3><img src="kartacli-state-machine-diagram.svg"></div>
</div>
</body>
</html>
