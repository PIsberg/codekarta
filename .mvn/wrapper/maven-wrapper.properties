# distributionSha256Sum pins the Maven distribution this wrapper is allowed to run. Without it the
# wrapper executes whatever bytes come back from distributionUrl, which makes every build on every
# developer machine and every CI runner trust that host and the path to it. The value below was not
# taken from the download: apache-maven-3.9.11-bin.zip was fetched, checked against the SHA-512
# that downloads.apache.org publishes over TLS, and this SHA-256 computed from the file that
# matched. Recompute it the same way when distributionUrl changes; a bumped URL with a stale sum
# fails the build rather than silently downgrading to trust-on-first-use.
wrapperVersion=3.3.4
distributionType=only-script
distributionUrl=https://repo.maven.apache.org/maven2/org/apache/maven/apache-maven/3.9.11/apache-maven-3.9.11-bin.zip
distributionSha256Sum=0d7125e8c91097b36edb990ea5934e6c68b4440eef4ea96510a0f6815e7eeadb
